{% extends "base.html" %}

{% block title %}BookHub - Géneros{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h2>Géneros</h2>
        <p>Categorías literarias disponibles.</p>
    </div>
</div>

<div class="card-bookhub mb-4">
    <h3 style="margin-top:0; font-size: 1.05rem;">Agregar Género</h3>
    <form action="{{ url_for('nuevo_genero') }}" method="POST" style="display:flex; gap:10px; flex-wrap:wrap;">
        <input type="text" name="nombre" class="form-control" placeholder="Nombre del género" required style="flex:1; min-width:200px;">
        <button type="submit" class="btn btn-dark">+ Agregar</button>
    </form>
</div>

<div class="list-grid">
    {% for genero in generos %}
    <div class="list-card">
        <span class="name">{{ genero.nombre }}</span>
        <div class="actions">
            <a href="{{ url_for('eliminar_genero', id=genero.id_genero) }}" class="btn btn-sm btn-danger">Borrar</a>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
