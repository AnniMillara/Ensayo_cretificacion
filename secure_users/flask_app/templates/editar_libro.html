{% extends "base.html" %}

{% block title %}BookHub - Editar Libro{% endblock %}

{% block content %}

<div class="page-header">
    <h2>Editar Libro</h2>
</div>

<div class="card-bookhub">
    <form action="{{ url_for('modificar_libro', id=libro.id_libro) }}" method="POST">
        <div class="mb-3">
            <label>Título</label>
            <input type="text" name="titulo" value="{{ libro.titulo }}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Autor</label>
            <select name="autor_id" class="form-control" required>
                <option value="">-- Selecciona un autor --</option>
                {% for autor in autores %}
                <option value="{{ autor.id_autor }}" {% if libro.autor_id == autor.id_autor %}selected{% endif %}>
                    {{ autor.nombre }} {{ autor.apellido }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label>Género</label>
            <select name="genero_id" class="form-control" required>
                <option value="">-- Selecciona un género --</option>
                {% for genero in generos %}
                <option value="{{ genero.id_genero }}" {% if libro.genero_id == genero.id_genero %}selected{% endif %}>
                    {{ genero.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label>Descripción</label>
            <textarea name="descripcion" class="form-control" rows="5" required>{{ libro.descripcion }}</textarea>
        </div>

        <button type="submit" class="btn btn-dark">Actualizar</button>
        <a href="{{ url_for('inicio_libros') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

{% endblock %}
