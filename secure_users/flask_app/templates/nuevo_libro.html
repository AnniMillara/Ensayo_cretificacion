{% extends "base.html" %}

{% block title %}BookHub - Nuevo Libro{% endblock %}

{% block content %}

<div class="page-header">
    <h2>Agregar Nuevo Libro</h2>
</div>

<div class="card-bookhub">
    <form action="{{ url_for('ingresar_libro') }}" method="POST">
        <div class="mb-3">
            <label>Título</label>
            <input type="text" name="titulo" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Autor</label>
            <select name="autor_id" class="form-control" required>
                <option value="">-- Selecciona un autor --</option>
                {% for autor in autores %}
                <option value="{{ autor.id_autor }}">{{ autor.nombre }} {{ autor.apellido }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label>Género</label>
            <select name="genero_id" class="form-control" required>
                <option value="">-- Selecciona un género --</option>
                {% for genero in generos %}
                <option value="{{ genero.id_genero }}">{{ genero.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label>Descripción</label>
            <textarea name="descripcion" class="form-control" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn btn-dark">Guardar</button>
        <a href="{{ url_for('inicio_libros') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

{% endblock %}
